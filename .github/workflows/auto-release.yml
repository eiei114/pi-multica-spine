name: Auto Release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Create release for new version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for version bump
        id: check
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG="v${CURRENT_VERSION}"

          # A manual dispatch has no push "before" SHA, so use the previous stable
          # release tag as the baseline (prerelease tags are ignored).
          PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -1)
          if [ -z "$PREVIOUS_TAG" ] || ! git cat-file -e "${PREVIOUS_TAG}:package.json" 2>/dev/null; then
            echo "No previous stable baseline is available; skipping auto release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(git show "${PREVIOUS_TAG}:package.json" | node -e "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => console.log(JSON.parse(input).version || ''));")

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "package.json version did not change (${CURRENT_VERSION}); skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse a downgrade so an out-of-order tag/release cannot be created.
          if ! node -e '
            const parse = (v) => v.split(".").map(Number);
            const [a, b] = [parse(process.argv[1]), parse(process.argv[2])];
            for (let i = 0; i < 3; i += 1) if (a[i] !== b[i]) process.exit(a[i] > b[i] ? 0 : 1);
            process.exit(1);
          ' "$CURRENT_VERSION" "$PREVIOUS_VERSION"; then
            echo "::error::Refusing to release ${CURRENT_VERSION}; it is not newer than the released ${PREVIOUS_VERSION}."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bump detected: ${PREVIOUS_VERSION} -> ${CURRENT_VERSION}."
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -1)
          NOTES="Released ${TAG}."
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger publish workflow
        if: steps.check.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          gh workflow run publish.yml --ref "$TAG" -f ref="$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
